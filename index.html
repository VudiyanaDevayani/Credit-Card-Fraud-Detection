<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - My Website</title>

  <!-- Bootstrap 5.3.2 Dark Mode Support -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0d0d0d url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      font-family: "Poppins", sans-serif;
    }

    /* Glass dark overlay */
    .overlay {
      backdrop-filter: blur(7px);
      background: rgba(0, 0, 0, 0.65);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8f9fa;
      text-align: center;
      padding: 20px;
    }

    /* Navbar modern style */
    .navbar {
      background: rgba(0, 0, 0, 0.85) !important;
      backdrop-filter: blur(8px);
    }

    .navbar-brand {
      letter-spacing: 1px;
    }

    /* Button Glow Effects */
    .btn-primary {
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      border: none;
      transition: 0.3s ease-in-out;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
    }

    .btn-outline-light:hover {
      background: #fff;
      color: #000 !important;
      transform: translateY(-3px);
    }

    h1 {
      text-shadow: 0 0 15px rgba(255,255,255,0.25);
    }

    p.lead {
      max-width: 700px;
      margin: auto;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">MyWebsite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('register') }}">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="overlay">
    <div>
      <h1 class="display-4 fw-bold">Welcome to My Website</h1>
      <p class="lead mt-3">
        Experience a clean, modern, and responsive platform built with Flask and Bootstrap 5 — 
        supporting login, registration, and personalized user sessions.
      </p>

      <div class="mt-4">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg me-2">Login</a>
        <a href="{{ url_for('register') }}" class="btn btn-outline-light btn-lg">Register</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
